[workspace]
resolver = "2"
members = ["nova_cli", "nova_embed", "nova_embed_ffi", "nova_vm", "nova_vm_derive", "num-bigint", "num-traits", "regress", "small_string", "tests", "unicode-normalization", "wtf8"]
exclude = ["nova_lint", "oxc"]

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "MPL-2.0"
homepage = "https://trynova.dev/"
repository = "https://github.com/trynova/nova/"
readme = "README.md"
keywords = ["javascript", "typescript", "interpreter"]
categories = ["development-tools"]
authors = ["The Nova Team"]

[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive"] }
cliclack = "=0.5.6"
console = "=0.16.6"
ctrlc = "=3.5.2"
hashbrown = "=0.17.1"
num-bigint = { path = "num-bigint" }
num-traits = "=0.2.19"
oxc_allocator = { path = "oxc/crates/oxc_allocator" }
oxc_ast = { path = "oxc/crates/oxc_ast" }
oxc_ast_visit = { path = "oxc/crates/oxc_ast_visit" }
oxc_diagnostics = { path = "oxc/crates/oxc_diagnostics" }
oxc_ecmascript = { path = "oxc/crates/oxc_ecmascript" }
oxc_parser = { path = "oxc/crates/oxc_parser" }
oxc_regular_expression = { path = "oxc/crates/oxc_regular_expression" }
oxc_semantic = { path = "oxc/crates/oxc_semantic" }
oxc_span = { path = "oxc/crates/oxc_span" }
oxc_syntax = { path = "oxc/crates/oxc_syntax" }
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
regress = { path = "regress", default-features = false, features = ["std", "utf16"] }
syn = "=2.0.119"
unicode-normalization = { path = "unicode-normalization" }
usdt = "=0.6.0"
wtf8 = { path = "wtf8" }
xsum = "=0.1.6"
temporal_rs = "=0.2.6"

[patch.crates-io]
bitflags = { path = "oxc/vendor/bitflags" }
cow-utils = { path = "oxc/vendor/cow-utils" }
num-traits = { path = "num-traits" }
unicode-id-start = { path = "oxc/vendor/unicode-id-start" }

[workspace.metadata.dylint]
libraries = [{ path = "nova_lint" }]

# The release profile, used for `cargo build --release`.
[profile.release]
# Enables "fat" LTO, for faster release builds
lto = "fat"
# Makes sure that all code is compiled together, for LTO
codegen-units = 1
# Strips debug information and symbols from the binary, reducing its size
strip = "symbols"

# This profile has all the same safety checks as dev builds. It trades slightly
# longer compile times for faster runs, which is worth it when running test262.
[profile.dev-fast]
inherits = "dev"
opt-level = 2
lto = "thin"
debug = "limited"

# Copies of crates.io crates with their `unsafe` removed (safe/OXC.md, area F).
